server.port=${PORT:8080}
# Needed on Render (HTTPS proxy) so redirects and login work correctly
server.forward-headers-strategy=framework
server.servlet.session.timeout=8h

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sessions live in the database, so users stay logged in when Render restarts
spring.session.jdbc.initialize-schema=always

# Password for the built-in admin account (skipped if empty)
app.admin-password=${ADMIN_PASSWORD:}
